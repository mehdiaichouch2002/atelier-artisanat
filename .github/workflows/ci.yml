name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials of the CI database container only.
      TEST_MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/atelier_test
      TEST_DATABASE_URL: postgres://atelier_app:ci-app-password@localhost:5432/atelier_test
      TEST_APP_DB_PASSWORD: ci-app-password
      E2E_PG_ADMIN: postgres:postgres
      E2E_PG_HOST: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Translations complete
        run: npm run i18n:check
      - name: Unit tests
        run: npm run test:unit
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database atelier_test"
      - name: Integration tests (PostgreSQL, RLS)
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
